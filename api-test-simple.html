<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test - Simple</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-4 bg-gray-100">
  <div class="max-w-md mx-auto mt-8">
    <div class="bg-white shadow-lg p-8 rounded-xl">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">API Test</h1>
      
      <button id="testApi" class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700">
        Test API
      </button>
      
      <div id="result" class="mt-4 p-4 bg-gray-50 rounded-lg hidden">
        <h3 class="font-semibold text-gray-900 mb-2">Result:</h3>
        <div id="resultContent"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('testApi').addEventListener('click', async function() {
      const button = this;
      const originalText = button.textContent;
      button.textContent = 'Testing...';
      button.disabled = true;
      
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('resultContent').innerHTML = '<p class="text-blue-600">Testing API...</p>';
      
      try {
        const response = await fetch('/api/simple-test');
        const result = await response.json();
        
        if (result.success) {
          document.getElementById('resultContent').innerHTML = `
            <div class="text-green-600">
              <p>✅ API Working!</p>
              <p>Message: ${result.message}</p>
              <p>Timestamp: ${result.timestamp}</p>
            </div>
          `;
        } else {
          document.getElementById('resultContent').innerHTML = `
            <div class="text-red-600">
              <p>❌ API Error</p>
              <p>Error: ${result.message}</p>
            </div>
          `;
        }
      } catch (error) {
        document.getElementById('resultContent').innerHTML = `
          <div class="text-red-600">
            <p>❌ Network Error</p>
            <p>Error: ${error.message}</p>
          </div>
        `;
      } finally {
        button.textContent = originalText;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
