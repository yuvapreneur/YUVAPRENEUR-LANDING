<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Test - Café Business Masterclass</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white p-4">
  <div class="max-w-4xl mx-auto mt-8">
    <h1 class="text-3xl font-bold text-center mb-8">🧪 System Test Page</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Test Registration -->
      <div class="bg-white shadow-lg p-6 border border-gray-200 rounded-xl">
        <h2 class="text-xl font-semibold mb-4">📝 Test Registration</h2>
        <form id="testRegistrationForm" class="space-y-4">
          <input type="text" name="name" placeholder="Test Name" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <input type="email" name="email" placeholder="test@example.com" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <input type="tel" name="phone" placeholder="1234567890" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <select name="profession" required class="w-full px-3 py-2 border border-gray-300 rounded">
            <option value="">Select profession</option>
            <option value="student">Student</option>
            <option value="entrepreneur">Entrepreneur</option>
          </select>
          <input type="text" name="city" placeholder="Test City" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <input type="text" name="state" placeholder="Test State" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <input type="password" name="password" placeholder="test123" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
            Test Registration
          </button>
        </form>
        <div id="registrationResult" class="mt-4 p-3 rounded text-sm"></div>
      </div>

      <!-- Test Login -->
      <div class="bg-white shadow-lg p-6 border border-gray-200 rounded-xl">
        <h2 class="text-xl font-semibold mb-4">🔐 Test Login</h2>
        <form id="testLoginForm" class="space-y-4">
          <input type="email" name="email" placeholder="test@example.com" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <input type="password" name="password" placeholder="test123" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded">
          <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
            Test Login
          </button>
        </form>
        <div id="loginResult" class="mt-4 p-3 rounded text-sm"></div>
      </div>
    </div>

    <!-- Current Data Display -->
    <div class="mt-8 bg-white shadow-lg p-6 border border-gray-200 rounded-xl">
      <h2 class="text-xl font-semibold mb-4">📊 Current Data Status</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <h3 class="font-medium text-gray-700">User Enrollment</h3>
          <div id="enrollmentStatus" class="text-sm text-gray-600">Loading...</div>
        </div>
        <div>
          <h3 class="font-medium text-gray-700">Temp User Data</h3>
          <div id="tempDataStatus" class="text-sm text-gray-600">Loading...</div>
        </div>
        <div>
          <h3 class="font-medium text-gray-700">Authentication</h3>
          <div id="authStatus" class="text-sm text-gray-600">Loading...</div>
        </div>
      </div>
      
      <div class="mt-4">
        <button onclick="clearAllData()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
          🗑️ Clear All Data
        </button>
        <button onclick="refreshStatus()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 ml-2">
          🔄 Refresh Status
        </button>
      </div>
    </div>

    <!-- Test Results -->
    <div class="mt-8 bg-white shadow-lg p-6 border border-gray-200 rounded-xl">
      <h2 class="text-xl font-semibold mb-4">✅ Test Results</h2>
      <div id="testResults" class="space-y-2 text-sm">
        <div>🚀 Ready to test the system...</div>
      </div>
    </div>
  </div>

  <script>
    // Test registration
    document.getElementById('testRegistrationForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = Object.fromEntries(formData);
      
      addTestResult('🔄 Testing registration...', 'info');
      
      try {
        const response = await fetch('/api/auth/register-fallback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        
        if (result.success) {
          addTestResult('✅ Registration successful!', 'success');
          document.getElementById('registrationResult').innerHTML = 
            '<div class="bg-green-100 text-green-800 p-2 rounded">Registration successful!</div>';
          
          // Store temp data
          localStorage.setItem('tempUserData', JSON.stringify(result.user));
          refreshStatus();
        } else {
          addTestResult('❌ Registration failed: ' + result.message, 'error');
          document.getElementById('registrationResult').innerHTML = 
            '<div class="bg-red-100 text-red-800 p-2 rounded">Registration failed: ' + result.message + '</div>';
        }
      } catch (error) {
        addTestResult('❌ Registration error: ' + error.message, 'error');
        document.getElementById('registrationResult').innerHTML = 
          '<div class="bg-red-100 text-red-800 p-2 rounded">Error: ' + error.message + '</div>';
      }
    });

    // Test login
    document.getElementById('testLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('testLoginForm').querySelector('[name="email"]').value.trim().toLowerCase();
      const password = document.getElementById('testLoginForm').querySelector('[name="password"]').value;
      
      addTestResult('🔄 Testing login...', 'info');
      
      // Check if user has data
      const enrollmentData = localStorage.getItem('userEnrollment');
      const tempUserData = localStorage.getItem('tempUserData');
      
      let userData = null;
      
      if (enrollmentData) {
        try {
          const parsed = JSON.parse(enrollmentData);
          if (parsed.email === email) {
            userData = parsed;
          }
        } catch (error) {
          console.error('Error parsing enrollment data:', error);
        }
      }
      
      if (!userData && tempUserData) {
        try {
          const parsed = JSON.parse(tempUserData);
          if (parsed.email === email) {
            userData = parsed;
          }
        } catch (error) {
          console.error('Error parsing temp data:', error);
        }
      }
      
      if (!userData) {
        addTestResult('❌ User not found', 'error');
        document.getElementById('loginResult').innerHTML = 
          '<div class="bg-red-100 text-red-800 p-2 rounded">User not found</div>';
        return;
      }
      
      if (userData.password && userData.password !== password) {
        addTestResult('❌ Wrong password', 'error');
        document.getElementById('loginResult').innerHTML = 
          '<div class="bg-red-100 text-red-800 p-2 rounded">Wrong password</div>';
        return;
      }
      
      addTestResult('✅ Login successful!', 'success');
      document.getElementById('loginResult').innerHTML = 
        '<div class="bg-green-100 text-green-800 p-2 rounded">Login successful!</div>';
      
      // Set authentication
      localStorage.setItem('userEnrollment', JSON.stringify(userData));
      localStorage.setItem('userAuthenticated', 'true');
      localStorage.setItem('loginTimestamp', Date.now().toString());
      refreshStatus();
    });

    // Utility functions
    function addTestResult(message, type) {
      const resultsDiv = document.getElementById('testResults');
      const resultDiv = document.createElement('div');
      resultDiv.className = `p-2 rounded ${type === 'success' ? 'bg-green-100 text-green-800' : 
                                               type === 'error' ? 'bg-red-100 text-red-800' : 
                                               'bg-blue-100 text-blue-800'}`;
      resultDiv.textContent = message;
      resultsDiv.appendChild(resultDiv);
      
      // Keep only last 10 results
      if (resultsDiv.children.length > 10) {
        resultsDiv.removeChild(resultsDiv.firstChild);
      }
    }

    function refreshStatus() {
      const enrollment = localStorage.getItem('userEnrollment');
      const tempData = localStorage.getItem('tempUserData');
      const auth = localStorage.getItem('userAuthenticated');
      
      document.getElementById('enrollmentStatus').textContent = 
        enrollment ? '✅ Found' : '❌ None';
      document.getElementById('tempDataStatus').textContent = 
        tempData ? '✅ Found' : '❌ None';
      document.getElementById('authStatus').textContent = 
        auth ? '✅ Authenticated' : '❌ Not authenticated';
    }

    function clearAllData() {
      if (confirm('Clear all data?')) {
        localStorage.removeItem('userEnrollment');
        localStorage.removeItem('tempUserData');
        localStorage.removeItem('userAuthenticated');
        localStorage.removeItem('loginTimestamp');
        refreshStatus();
        addTestResult('🗑️ All data cleared', 'info');
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      refreshStatus();
      addTestResult('🚀 Test system loaded', 'info');
    });
  </script>
</body>
</html>
