<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Café Business Masterclass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="min-h-screen p-4" style="background: linear-gradient(135deg, #0F172A 0%, #312E81 50%, #7C3AED 100%);">
  <div class="max-w-md mx-auto mt-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
      <p class="text-gray-200">Access your Café Business Masterclass</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white shadow-lg p-8 border border-gray-200 rounded-xl">
      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-gray-700 text-sm font-medium mb-2">Email Address</label>
          <input type="email" name="email" id="email" required 
                 class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors"
                 placeholder="Enter your email address">
        </div>
        
        <div>
          <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
          <div class="relative">
            <input type="password" name="password" id="password" required 
                   class="w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors"
                   placeholder="Enter your password">
            <button type="button" id="togglePassword" 
                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="w-full px-6 py-3 text-white font-semibold text-lg rounded-lg transition-colors btn-gradient">
          Login to Dashboard
        </button>
      </form>
      
      <!-- Forgot Password Link -->
      <div class="mt-4 text-center">
        <a href="#" onclick="showForgotPassword()" class="text-purple-600 hover:text-purple-700 text-sm underline">Forgot Password?</a>
      </div>
      
      <!-- Forgot Password Modal -->
      <div id="forgotPasswordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl max-w-md w-full mx-4">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-900">Reset Password</h3>
            <button onclick="hideForgotPassword()" class="text-gray-500 hover:text-gray-700">✕</button>
          </div>
          
          <div id="forgotPasswordStep">
            <p class="text-gray-600 mb-4">Enter your email address to reset your password.</p>
            <input type="email" id="resetEmail" placeholder="Enter your email" 
                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors mb-4">
            <input type="password" id="newPassword" placeholder="New password" 
                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors mb-4">
            <input type="password" id="confirmPassword" placeholder="Confirm new password" 
                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors mb-4">
            <button onclick="resetPassword()" class="w-full px-6 py-3 text-white font-semibold rounded-lg transition-colors btn-gradient">
              Reset Password
            </button>
          </div>
          
          <div id="forgotPasswordMessage" class="mt-4 text-center"></div>
        </div>
      </div>
      
      <!-- Navigation Links -->
      <div class="mt-6 text-center space-y-3">
        <p class="text-gray-600 text-sm">
          Don't have an account? 
          <a href="/" class="text-purple-600 hover:text-purple-700 font-medium">Enroll Now</a>
        </p>
        <p class="text-gray-600 text-sm">
          <a href="/" class="text-purple-600 hover:text-purple-700">← Back to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      
      const svg = this.querySelector('svg');
      if (type === 'text') {
        svg.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
        `;
      } else {
        svg.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        `;
      }
    });

    // Form submission - ONLY SERVER AUTHENTICATION
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      
      console.log('🔍 Login attempt:', { email, password });
      
      // Show loading state
      const submitBtn = document.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Logging in...';
      submitBtn.disabled = true;
      
      try {
        // Make API call to server for authentication
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        console.log('🔐 Server response:', result);
        
        if (result.success) {
          console.log('✅ Login successful!');
          
          // Store user data for session
          localStorage.setItem('userEnrollment', JSON.stringify(result.user));
          localStorage.setItem('userAuthenticated', 'true');
          localStorage.setItem('loginTimestamp', Date.now().toString());
          
          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          console.log('❌ Login failed:', result.error);
          alert(`❌ Login Failed\n\n${result.error}\n\n${result.suggestions ? result.suggestions.join('\n') : ''}`);
        }
      } catch (error) {
        console.error('❌ Login error:', error);
        alert('❌ Login Error\n\nNetwork error. Please check your connection and try again.');
      } finally {
        // Reset button state
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });

    // Forgot password functions
    function showForgotPassword() {
      document.getElementById('forgotPasswordModal').classList.remove('hidden');
    }

    function hideForgotPassword() {
      document.getElementById('forgotPasswordModal').classList.add('hidden');
      document.getElementById('forgotPasswordMessage').innerHTML = '';
    }

    async function resetPassword() {
      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!email || !newPassword || !confirmPassword) {
        document.getElementById('forgotPasswordMessage').innerHTML = 
          '<p class="text-red-600">Please fill all fields</p>';
        return;
      }
      
      if (newPassword !== confirmPassword) {
        document.getElementById('forgotPasswordMessage').innerHTML = 
          '<p class="text-red-600">Passwords do not match</p>';
        return;
      }
      
      if (newPassword.length < 6) {
        document.getElementById('forgotPasswordMessage').innerHTML = 
          '<p class="text-red-600">Password must be at least 6 characters</p>';
        return;
      }
      
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, newPassword })
        });
        
        const result = await response.json();
        
        if (result.success) {
          document.getElementById('forgotPasswordMessage').innerHTML = 
            '<p class="text-green-600">Password updated successfully! You can now login.</p>';
          setTimeout(() => {
            hideForgotPassword();
          }, 2000);
        } else {
          document.getElementById('forgotPasswordMessage').innerHTML = 
            `<p class="text-red-600">${result.error}</p>`;
        }
      } catch (error) {
        document.getElementById('forgotPasswordMessage').innerHTML = 
          '<p class="text-red-600">Network error. Please try again.</p>';
      }
    }
  </script>
</body>
</html>
