<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Test - Café Business Masterclass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="min-h-screen p-4" style="background: linear-gradient(135deg, #0F172A 0%, #312E81 50%, #7C3AED 100%);">
  <div class="max-w-md mx-auto mt-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Login Test</h1>
      <p class="text-gray-200">Testing login for live website</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white shadow-lg p-8 border border-gray-200 rounded-xl">
      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-gray-700 text-sm font-medium mb-2">Email Address</label>
          <input type="email" name="email" id="email" required 
                 class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors"
                 placeholder="Enter your email address"
                 value="abhijeetwankhede61@gmail.com">
        </div>
        
        <div>
          <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
          <div class="relative">
            <input type="password" name="password" id="password" required 
                   class="w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:border-purple-600 focus:bg-white transition-colors"
                   placeholder="Enter your password"
                   value="123456">
          </div>
        </div>
        
        <button type="submit" class="w-full px-6 py-3 text-white font-semibold text-lg rounded-lg transition-colors btn-gradient">
          Test Login
        </button>
      </form>
      
      <!-- Test Results -->
      <div id="testResults" class="mt-6 p-4 bg-gray-50 rounded-lg hidden">
        <h3 class="font-semibold text-gray-900 mb-2">Test Results:</h3>
        <div id="resultContent"></div>
      </div>
      
      <!-- Navigation Links -->
      <div class="mt-6 text-center space-y-3">
        <p class="text-gray-600 text-sm">
          <a href="/" class="text-purple-600 hover:text-purple-700">← Back to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Form submission with detailed logging
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      
      console.log('🔍 Login attempt:', { email, password });
      
      // Show loading state
      const submitBtn = document.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Testing...';
      submitBtn.disabled = true;
      
      // Show results container
      document.getElementById('testResults').classList.remove('hidden');
      document.getElementById('resultContent').innerHTML = '<p class="text-blue-600">Testing login...</p>';
      
      try {
        // Make API call to server for authentication
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        console.log('📡 Response status:', response.status);
        console.log('📡 Response headers:', response.headers);
        
        const result = await response.json();
        
        console.log('🔐 Server response:', result);
        
        if (result.success) {
          console.log('✅ Login successful!');
          document.getElementById('resultContent').innerHTML = `
            <div class="text-green-600">
              <p>✅ Login Successful!</p>
              <p>User: ${result.user.name}</p>
              <p>Email: ${result.user.email}</p>
              <p>Course Access: ${result.user.hasMainCourse ? '✅ Yes' : '❌ No'}</p>
            </div>
          `;
        } else {
          console.log('❌ Login failed:', result.error);
          document.getElementById('resultContent').innerHTML = `
            <div class="text-red-600">
              <p>❌ Login Failed</p>
              <p>Error: ${result.error}</p>
              ${result.suggestions ? `<p>Suggestions: ${result.suggestions.join(', ')}</p>` : ''}
            </div>
          `;
        }
      } catch (error) {
        console.error('❌ Login error:', error);
        document.getElementById('resultContent').innerHTML = `
          <div class="text-red-600">
            <p>❌ Network Error</p>
            <p>Error: ${error.message}</p>
            <p>Please check your connection and try again.</p>
          </div>
        `;
      } finally {
        // Reset button state
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
